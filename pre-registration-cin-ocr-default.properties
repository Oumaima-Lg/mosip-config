# OCR engine selection
mosip.cin.ocr.engine=tesseract
mosip.cin.ocr.tesseract.data.path=/usr/share/tesseract-ocr/5/tessdata
mosip.cin.ocr.tesseract.languages=ara+fra

# Optional original-image storage (off by default)
mosip.cin.ocr.image.store.enabled=false
mosip.cin.ocr.minio.bucket=cin-images

# Minio (object store) credentials inherited from application-default.properties
# mosip.object.store.s3.url
# mosip.object.store.s3.accesskey
# mosip.object.store.s3.secretkey

# Auth — same realm as the other pre-reg services
auth.server.validate.url=${mosip.kernel.authmanager.url}/v1/authmanager/authorize/validateToken
mosip.iam.certs_endpoint=${keycloak.internal.url}/auth/realms/mosip/protocol/openid-connect/certs

# HS256 secret used by local-dev (matches application-default)
prereg.auth.jwt.secret=Yn2kjibddFAWtnPJ2AFlL8WXmohJMCvigQggaEypa5E=

# Role mapping for the extract endpoint (mirrors application-service)
mosip.role.prereg.cinocrextract=INDIVIDUAL,REGISTRATION_OFFICER,REGISTRATION_SUPERVISOR,REGISTRATION_ADMIN

# Multipart upload sizing — CIN images are typically < 5 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Actuator exposure
management.endpoints.web.exposure.include=info,health,refresh,prometheus



# ============================================================
# Step 2: Python OCR Engine Configuration
# ============================================================
# Choose OCR engine: "python" or "tesseract" (default: tesseract)
mosip.cin.ocr.engine=python

# Python OCR service URL (where cin-ocr-python is running)
mosip.cin.ocr.python.url=http://localhost:5000

# Fallback to Tesseract if Python service is unavailable
mosip.cin.ocr.tesseract.languages=ara+fra

# Image storage settings
mosip.cin.ocr.image.store.enabled=false
mosip.object.store.s3.url=http://localhost:9000
mosip.object.store.s3.accesskey=admin
mosip.object.store.s3.secretkey=
mosip.cin.ocr.minio.bucket=cin-images